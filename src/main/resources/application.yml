server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: robot-delivery
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:robot_delivery}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: robot-delivery
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

# 配送业务参数（均可通过环境变量覆盖，便于演示超时类异常）
delivery:
  pickup-timeout-seconds: ${PICKUP_TIMEOUT_SECONDS:600}      # 用户超时不取（默认10分钟）
  coldchain-timeout-seconds: ${COLDCHAIN_TIMEOUT_SECONDS:2700} # 冷藏订单履约时限（默认45分钟）
  elevator-timeout-seconds: ${ELEVATOR_TIMEOUT_SECONDS:180}   # 电梯请求超时（默认3分钟）
  low-battery-threshold: ${LOW_BATTERY_THRESHOLD:20}          # 低电量阈值（%）
  scheduler-interval-ms: ${SCHEDULER_INTERVAL_MS:10000}       # 超时巡检间隔
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  # 冷链温控（持续计算载物仓温度与剩余可配送时长）
  coldchain-base-temp-celsius: ${COLDCHAIN_BASE_TEMP:4}       # 标准冷藏温度
  coldchain-warn-temp-celsius: ${COLDCHAIN_WARN_TEMP:6}       # 预警温度
  coldchain-critical-temp-celsius: ${COLDCHAIN_CRITICAL_TEMP:8} # 严重风险温度
  coldchain-warm-rate-per-minute: ${COLDCHAIN_WARM_RATE:4}    # 等待时升温速率(℃/分钟)
  coldchain-cool-rate-per-minute: ${COLDCHAIN_COOL_RATE:2}    # 移动时回冷速率(℃/分钟)
  coldchain-warn-remaining-ratio: ${COLDCHAIN_WARN_RATIO:0.30}   # 剩余时长<30%预警
  coldchain-critical-remaining-ratio: ${COLDCHAIN_CRITICAL_RATIO:0.12} # 剩余时长<12%严重

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.apache.kafka: warn
    org.springframework.kafka: warn
